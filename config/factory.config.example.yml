# ファクトリー側の設定の例。
# config/factory.config.yml に複製して書き換える(実際の設定はGit管理外)。

dry_run: true # true の間、GitHubへ一切書き込まない
poll_interval_sec: 60
db_path: /data/factory.db
repos_dir: /data/repos # 事務局専用のミラーの置き場所(絶対パス)。ワーカーには見せない
work_dir: /work # イシューごとの作業場所の置き場所(絶対パス)。repos_dir とは別の場所にする
logs_dir: /data/logs # ワーカーの呼び出しのログの置き場所(絶対パス)。work_dir と repos_dir の外に置く
# ワーカーの既定のイメージ(docker compose build worker-image で作る)。
# 別の名前にするときは、.env の WORKER_IMAGE にも同じ値を書く(ビルドで付く名前を揃えるため)。
worker_image: factory-worker
retry_wait_minutes: [5, 30, 120] # 失敗後の待機時間(分)。回数が足りなければ最後の値を使う
daily_run_limit: 20 # UTCの1日に着手する実行の数の上限(再試行を含む、全リポジトリの合計)
commit_author: # 省略可。ワーカーのコミットの作者。作業場所を作るときに、cloneのgit設定に書く
  # 名前とメールアドレスの先頭と末尾に、空白や記号(. , : ; " ' \)を置かない。gitがコミットに書くときに落とす
  name: factory-worker
  email: factory-worker@example.invalid # 実在の宛先に届かないものにする
# 省略可。ステップごとの上限。書かなかった項目は、下の値(既定値)になる。
# 上限に達したステップは失敗になり、retry_wait_minutes の待機の後に再試行する。
# timeout_sec は秒で、1から14400(4時間。起動係が受け付ける上限)までの整数。max_turns は1以上の整数。
step_limits:
  plan: # 計画
    timeout_sec: 1800 # 30分
    max_turns: 50
  implement: # 実装
    timeout_sec: 7200 # 2時間
    max_turns: 200
  review: # レビュー
    timeout_sec: 1800 # 30分
    max_turns: 50
  verify: # 検査。Claudeを呼ばないので、ターン数はない
    timeout_sec: 1800 # 検査コマンド1つごとの時間。30分
repos:
  - repo: owner/name # 対象リポジトリ
    token_env: GITHUB_TOKEN_EXAMPLE # トークンを入れた環境変数の名前(値は .env に書く)
    # worker_image: owner-name-worker # 省略可。製品に固有のツールが要る場合に指定する
